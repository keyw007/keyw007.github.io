name: 更新 Firebase 登入元件
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sync-firebase-auth.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下載登入元件
        run: |
          set -e
          SRC=https://tripsplit-86d7e.firebaseapp.com
          mkdir -p __/auth __/firebase
          # GitHub Pages 會把沒有副檔名的網址對應到同名 .html，所以 handler、iframe 存成 .html
          fail=0
          get() {
            code=$(curl -sSL -w '%{http_code}' -o "$2" "$SRC$1")
            echo "$code $1"
            if [ "$code" != 200 ]; then rm -f "$2"; [ "$3" = optional ] || fail=1; fi
          }
          get /__/auth/handler        __/auth/handler.html
          get /__/auth/iframe         __/auth/iframe.html
          get /__/auth/handler.js     __/auth/handler.js
          get /__/auth/iframe.js      __/auth/iframe.js
          get /__/auth/experiments.js __/auth/experiments.js optional
          get /__/firebase/init.json  __/firebase/init.json
          # handler.html 裡引用的其他檔案也列出來，方便確認沒有漏抓
          grep -o 'src="[^"]*"' __/auth/*.html || true
          [ $fail = 0 ]
          ls -la __/auth __/firebase
      - name: 提交
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add __
          git diff --cached --quiet || git commit -m "更新 Firebase 登入元件"
          git push
